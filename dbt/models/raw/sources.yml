version: 2

sources:
  - name: hr
    description: >
      Raw Human Resources data loaded from synthetic operational sources for
      employees, payroll, performance reviews, consulting firms, and departments.
    schema: raw

    tables:
      - name: src_hr_employees
        description: >
          Employee master data containing identity, organizational, compensation,
          consulting-firm, performance, and turnover attributes.
        columns:
          - name: extraction_date
            description: Date on which the record was extracted from the source system.
            tests:
              - not_null

          - name: source_system
            description: Operational system from which the record originated.
            tests:
              - not_null

          - name: source_file
            description: Name of the source file from which the record was loaded.

          - name: source_row_number
            description: Source-file row number used for traceability and troubleshooting.

          - name: employee_id
            description: Internal employee identifier.
            tests:
              - not_null

          - name: first_name
            description: Employee first name.

          - name: last_name
            description: Employee last name.

          - name: department_code
            description: Code of the department to which the employee belongs.
            tests:
              - relationships:
                  to: source('hr', 'src_hr_departments')
                  field: department_code

          - name: department_name
            description: Name of the department to which the employee belongs.

          - name: employment_type
            description: Employee engagement category.

          - name: salary
            description: Salary assigned to the employee.

          - name: hourly_rate
            description: Standard hourly rate for the employee.

          - name: overtime_hourly_rate
            description: Overtime hourly rate for the employee.

          - name: consulting_firm_tax_id
            description: Tax identifier of the associated consulting firm, when applicable.
            tests:
              - relationships:
                  to: source('hr', 'src_hr_consulting_firms')
                  field: consulting_firm_tax_id

          - name: consulting_firm_legal_name
            description: Legal name of the associated consulting firm, when applicable.

          - name: performance_rating_2024
            description: Employee performance rating for 2024.

          - name: performance_rating_2023
            description: Employee performance rating for 2023.

          - name: performance_rating_2022
            description: Employee performance rating for 2022.

          - name: performance_rating_2021
            description: Employee performance rating for 2021.

          - name: performance_rating_2020
            description: Employee performance rating for 2020.

          - name: turnover_flag
            description: Numeric indicator showing whether employee turnover occurred.
            tests:
              - accepted_values:
                  values: [0, 1]
                  quote: false

      - name: src_hr_payroll
        description: >
          Payroll records containing settlement status, compensation components,
          paid hours, deductions, gross pay, and estimated employer cost.
        columns:
          - name: source_system
            description: Operational system from which the record originated.
            tests:
              - not_null

          - name: extraction_date
            description: Date on which the record was extracted from the source system.
            tests:
              - not_null

          - name: payroll_receipt_id
            description: Unique payroll receipt identifier.
            tests:
              - not_null
              - unique

          - name: payroll_period
            description: Payroll settlement period in year-month format.
            tests:
              - not_null

          - name: employee_id
            description: Internal employee identifier.
            tests:
              - not_null
              - relationships:
                  to: source('hr', 'src_hr_employees')
                  field: employee_id

          - name: first_name
            description: Employee first name.

          - name: last_name
            description: Employee last name.

          - name: department_code
            description: Department code associated with the payroll record.
            tests:
              - relationships:
                  to: source('hr', 'src_hr_departments')
                  field: department_code

          - name: employment_type
            description: Employee engagement category.

          - name: consulting_firm_tax_id
            description: Tax identifier of the associated consulting firm, when applicable.
            tests:
              - relationships:
                  to: source('hr', 'src_hr_consulting_firms')
                  field: consulting_firm_tax_id

          - name: payroll_status
            description: Processing status of the payroll record.

          - name: paid_days
            description: Number of days paid in the payroll period.

          - name: monthly_salary
            description: Monthly salary used in the payroll calculation.

          - name: regular_hours
            description: Number of regular hours included in the payroll calculation.

          - name: regular_hours_amount
            description: Amount paid for regular hours.

          - name: overtime_hours
            description: Number of overtime hours included in the payroll calculation.

          - name: overtime_amount
            description: Amount paid for overtime hours.

          - name: productivity_bonus
            description: Productivity bonus included in the payroll calculation.

          - name: absence_deduction
            description: Amount deducted for employee absences.

          - name: gross_pay
            description: Total gross payroll amount.

          - name: estimated_employer_cost
            description: Estimated total employer cost associated with the payroll record.

      - name: src_hr_performance_reviews
        description: >
          Annual employee performance-review results by employee and department.
        columns:
          - name: source_system
            description: Operational system from which the record originated.
            tests:
              - not_null

          - name: extraction_date
            description: Date on which the record was extracted from the source system.
            tests:
              - not_null

          - name: source_row_number
            description: Source-file row number used for traceability and troubleshooting.

          - name: employee_id
            description: Internal identifier of the reviewed employee.
            tests:
              - not_null
              - relationships:
                  to: source('hr', 'src_hr_employees')
                  field: employee_id

          - name: first_name
            description: Reviewed employee first name.

          - name: last_name
            description: Reviewed employee last name.

          - name: department_code
            description: Department code associated with the performance review.
            tests:
              - relationships:
                  to: source('hr', 'src_hr_departments')
                  field: department_code

          - name: review_year
            description: Calendar year to which the performance review applies.
            tests:
              - not_null
              - accepted_values:
                  values: [2020, 2021, 2022, 2023, 2024]
                  quote: false

          - name: performance_rating
            description: Rating assigned to the employee in the performance review.

      - name: src_hr_consulting_firms
        description: >
          Consulting-firm vendor catalog containing tax identifiers, legal names,
          and vendor status.
        columns:
          - name: consulting_firm_tax_id
            description: Tax identifier of the consulting firm.
            tests:
              - not_null
              - unique

          - name: consulting_firm_legal_name
            description: Registered legal name of the consulting firm.
            tests:
              - not_null

          - name: vendor_status
            description: Current vendor status of the consulting firm.

          - name: extraction_date
            description: Date on which the record was extracted from the source system.
            tests:
              - not_null

          - name: source_system
            description: Operational system from which the record originated.
            tests:
              - not_null

      - name: src_hr_departments
        description: Department catalog containing department codes, names, and activity status.
        columns:
          - name: department_code
            description: Unique department code.
            tests:
              - not_null
              - unique

          - name: department_name
            description: Department name.
            tests:
              - not_null

          - name: is_active
            description: Raw indicator showing whether the department is active.

          - name: extraction_date
            description: Date on which the record was extracted from the source system.
            tests:
              - not_null

          - name: source_system
            description: Operational system from which the record originated.
            tests:
              - not_null
