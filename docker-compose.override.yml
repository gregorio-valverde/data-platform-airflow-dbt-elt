services:
  scheduler:
    container_name: airflow_scheduler_gvn
    env_file:
      - .env
    volumes:
      - ./dbt:/usr/local/airflow/dbt
      - ./.env:/usr/local/airflow/.env:ro
    networks:
      - airflow_gvn_net

  dag-processor:
    container_name: airflow_dag_processor_gvn
    env_file:
      - .env
    volumes:
      - ./.env:/usr/local/airflow/.env:ro
    networks:
      - airflow_gvn_net

  api-server:
    container_name: airflow_api_server_gvn
    env_file:
      - .env
    volumes:
      - ./.env:/usr/local/airflow/.env:ro
    networks:
      - airflow_gvn_net

  triggerer:
    container_name: airflow_triggerer_gvn
    env_file:
      - .env
    volumes:
      - ./.env:/usr/local/airflow/.env:ro
    networks:
      - airflow_gvn_net

  postgres:
    container_name: airflow_postgres_gvn
    networks:
      - airflow_gvn_net

  dw_postgres:
    image: postgres:16
    container_name: dw_postgres_gvn
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${DW_POSTGRES_USER:?DW_POSTGRES_USER is required}"
        : "$${DW_POSTGRES_PASSWORD:?DW_POSTGRES_PASSWORD is required}"
        : "$${DW_POSTGRES_DB:?DW_POSTGRES_DB is required}"
        export POSTGRES_USER="$${DW_POSTGRES_USER}"
        export POSTGRES_PASSWORD="$${DW_POSTGRES_PASSWORD}"
        export POSTGRES_DB="$${DW_POSTGRES_DB}"
        exec docker-entrypoint.sh postgres
    ports:
      - "5433:5432"
    volumes:
      - dw_postgres_data:/var/lib/postgresql/data
    networks:
      - airflow_gvn_net

volumes:
  dw_postgres_data:

networks:
  airflow_gvn_net:
    name: airflow_gvn_net
    driver: bridge
